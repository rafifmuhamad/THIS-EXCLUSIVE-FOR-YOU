<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for Ayas 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body { 
            background-color: #ffe6f2; 
            font-family: 'Quicksand', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        .box { 
            background: white; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3); 
            text-align: center; 
            width: 85%; 
            max-width: 400px; 
            border: 3px solid #ff69b4; 
        }
        h1 { color: #ff1493; font-size: 2.2rem; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; font-size: 1.1rem; }
        .step { display: none; }
        .active { display: block; }
        
        button { 
            background: #ff69b4; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 20px; 
            transition: 0.3s; 
            box-shadow: 0 4px #b3497d;
        }
        button:hover { background: #ff1493; transform: scale(1.05); }
        button:active { transform: translateY(4px); box-shadow: none; }

        img { 
            width: 100%; 
            max-height: 300px;
            object-fit: cover;
            border-radius: 20px; 
            margin-top: 15px; 
            border: 4px solid #ff69b4; 
        }
        .emoji { font-size: 3rem; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <audio id="lagu" loop>
        <source src="lagu.mp3" type="audio/mpeg">
    </audio>

    <div class="box animate__animated animate__zoomIn">
        
        <div id="step1" class="step active">
            <span class="emoji">🌙</span>
            <h1>Goodnight Ayas</h1>
            <p>Ada pesan singkat buat kamu...</p>
            <button onclick="mulai()">Klik Terus Lanjut &rarr;</button>
        </div>

        <div id="step2" class="step">
            <span class="emoji">🥺</span>
            <p class="animate__animated animate__fadeIn">Semoga kamu mimpii indah ya sayanggg...</p>
            <p class="animate__animated animate__fadeIn animate__delay-1s">Maaf kalo aku bikin kamu sensi tadii heheee 💞💞</p>
            <button onclick="keHalaman(3)">Liat Sesuatu? 😍</button>
        </div>

        <div id="step3" class="step">
            <h2 style="color: #ff1493;">Cantiknya Aku... ✨</h2>
            <img src="ayas.jpg" alt="Foto Ayas">
            <p style="margin-top: 15px; font-weight: bold; color: #ff1493;">Tidur yang nyenyak ya Ayas! 💤</p>
        </div>

    </div>

    <script>
        function mulai() {
            // Putar lagu
            var music = document.getElementById("lagu");
            music.play();
            keHalaman(2);
        }

        function keHalaman(n) {
            // Sembunyikan semua halaman
            document.querySelectorAll('.step').forEach(s => {
                s.classList.remove('active', 'animate__animated', 'animate__fadeIn');
            });
            // Tampilkan halaman tujuan
            var target = document.getElementById('step' + n);
            target.classList.add('active', 'animate__animated', 'animate__fadeIn');
        }
    </script>
</body>
</html>
