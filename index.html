<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for Ayas 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        
        body { background-color: #ffe6f2; font-family: 'Quicksand', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .box { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3); text-align: center; width: 85%; max-width: 400px; border: 3px solid #ff69b4; }
        
        h1 { color: #ff1493; font-size: 2.5rem; margin-bottom: 20px; }
        p { color: #666; line-height: 1.6; font-size: 1.1rem; }
        
        .step { display: none; }
        .active { display: block; animation: fadeIn 0.8s; }
        
        button { background: #ff69b4; color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #ff1493; transform: scale(1.1); }

        img { width: 100%; border-radius: 20px; margin-top: 15px; border: 4px solid #ff69b4; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .typing { border-right: 3px solid #ff69b4; white-space: nowrap; overflow: hidden; animation: typing 3s steps(30, end), blink 0.5s step-end infinite; display: inline-block; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: #ff69b4 } }
    </style>
</head>
<body>

    <div class="box">
        <div id="step1" class="step active">
            <h1>Goodnight Ayas 🌙</h1>
            <button onclick="nextStep(2)">Lanjut &rarr;</button>
        </div>

        <div id="step2" class="step">
            <p class="typing">Semoga kamu mimpi indah ya sayanggg...</p>
            <p style="margin-top:10px;">Maaf kalo aku bikin kamu sensi tadii heheee, jangan ovt meyuyu yahhh 💞💞</p>
            <button onclick="nextStep(3)">Liat Sesuatu? 😍</button>
        </div>

        <div id="step3" class="step">
            <h2 style="color: #ff1493;">love u sayangggggg... ✨</h2>
            <img src="ayas_cakep.jpg" alt="Foto Ayas Cantik">
            <p style="margin-top: 15px; font-weight: bold;">bobonya yang nyenyak ya! 💤</p>
        </div>
    </div>

    <script>
        function nextStep(n) {
            // Sembunyikan semua step
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            // Tampilkan step yang diminta
            document.getElementById('step' + n).classList.add('active');
        }
    </script>
</body>
</html>
